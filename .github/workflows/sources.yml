name: 一次資料の取り寄せ

# 適法性の説明が引く外国の一次資料を取り寄せ、verification/sources-raw.json に記して、新しい枝 sources/<日付> に置く。
# 手で動かす。main には直に入れない。取り寄せた文は、運営者が読んでから verification/sources.json の引用に使う。
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    name: 一次資料を取り寄せる
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: node tools/sources.js
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add verification/sources-raw.json
          git commit -m "一次資料：取り寄せた文を記す" || exit 0
          git push origin "HEAD:refs/heads/sources/$(date -u +%Y%m%d-%H%M)"
