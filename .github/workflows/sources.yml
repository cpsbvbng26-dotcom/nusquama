name: 一次資料の取り寄せ

# 探り（2026-11-13、十一度目の見落とし）：官報の発行に関する法律の第1条・第2条・第16条・第18条から第21条を、
# 見張り（tools/statutes.js）と同じ手順で e-Gov 法令 API から取り寄せ、条文と SHA-256 を探りの枝にだけ記す。main には入れない。
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    name: 官報の発行に関する法律を取り寄せる
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: |
          node -e '
          const fs = require("fs"), crypto = require("crypto");
          const UA = { "User-Agent": "nusquama (https://github.com/cpsbvbng26-dotcom/nusquama)" };
          const plain = (x) => x.replace(/<Rt>[^<]*<\/Rt>/g, "").replace(/<[^>]+>/g, " ").replace(/\s+/g, " ").trim();
          const sha = (x) => crypto.createHash("sha256").update(x, "utf8").digest("hex");
          (async () => {
            const id = "505AC0000000085";
            const xml = await (await fetch("https://laws.e-gov.go.jp/api/1/lawdata/" + id, { headers: UA })).text();
            const title = (/<LawTitle[^>]*>([^<]*)<\/LawTitle>/.exec(xml) || [])[1] || "";
            const main = (/<MainProvision[\s\S]*?<\/MainProvision>/.exec(xml) || [""])[0];
            const out = { statutes: [], texts: {} };
            for (const n of ["1", "2", "16", "18", "19", "20", "21"]) {
              const m = new RegExp("<Article[^>]*\\sNum=\"" + n + "\"[^>]*>[\\s\\S]*?</Article>").exec(main);
              const t = plain(m[0]);
              out.statutes.push({ name: title, label: "第" + n + "条", law_id: id, article: n, title, sha256: sha(t) });
              out.texts[title + " 第" + n + "条"] = t;
            }
            fs.writeFileSync("kanpo-probe.json", JSON.stringify(out, null, 2) + "\n");
            console.log(JSON.stringify(out.statutes));
          })().catch((e) => { console.error(e); process.exit(1); });'
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add kanpo-probe.json
          git commit -m "探り：官報の発行に関する法律の条文を記す（main に入れない）"
          git push origin HEAD:refs/heads/claude/redteam11-probe-1113
