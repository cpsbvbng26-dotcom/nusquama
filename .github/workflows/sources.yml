name: 一次資料の取り寄せ

# 探り（2026-11-13、十一度目の見落とし）：官報の発行に関する法律を e-Gov 法令 API から取り寄せ、条ごとに記録へ書き出す。
# main には入れない。何も押さない。
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fetch:
    name: 官報の発行に関する法律を取り寄せる
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: |
          node -e '
          const crypto = require("crypto");
          const UA = { "User-Agent": "nusquama (https://github.com/cpsbvbng26-dotcom/nusquama)" };
          const plain = (x) => x.replace(/<Rt>[^<]*<\/Rt>/g, "").replace(/<[^>]+>/g, " ").replace(/\s+/g, " ").trim();
          const sha = (x) => crypto.createHash("sha256").update(x, "utf8").digest("hex");
          (async () => {
            const list = await (await fetch("https://laws.e-gov.go.jp/api/1/lawlists/1", { headers: UA })).text();
            const hits = [];
            for (const m of list.matchAll(/<LawNameListInfo>([\s\S]*?)<\/LawNameListInfo>/g)) {
              const g = (t) => (new RegExp("<" + t + ">([^<]*)</" + t + ">").exec(m[1]) || [])[1] || "";
              if (g("LawName").includes("官報")) hits.push({ id: g("LawId"), name: g("LawName"), num: g("LawNo"), date: g("PromulgationDate") });
            }
            console.log("LIST " + JSON.stringify(hits));
            for (const h of hits.filter((x) => x.name.startsWith("官報の発行に関する法律"))) {
              const xml = await (await fetch("https://laws.e-gov.go.jp/api/1/lawdata/" + h.id, { headers: UA })).text();
              console.log("=====LAW " + h.id + " " + (/<LawTitle[^>]*>([^<]*)<\/LawTitle>/.exec(xml) || [])[1] + " " + (/<LawNum>([^<]*)<\/LawNum>/.exec(xml) || [])[1]);
              const main = (/<MainProvision[\s\S]*?<\/MainProvision>/.exec(xml) || [""])[0];
              for (const a of main.matchAll(/<Article[^>]*\sNum="([^"]+)"[^>]*>[\s\S]*?<\/Article>/g)) { const t = plain(a[0]); console.log("ART " + a[1] + " " + sha(t) + " " + t); }
              for (const s of xml.matchAll(/<SupplProvision[\s\S]*?<\/SupplProvision>/g)) console.log("SUPPL " + plain(s[0]));
              console.log("MAINLEN " + main.length + " ARTS " + [...main.matchAll(/<Article[^>]*\sNum="([^"]+)"/g)].length);
            }
          })().catch((e) => { console.error(e); process.exit(1); });'
