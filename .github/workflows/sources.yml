name: 一次資料の取り寄せ

# 適法性の説明が引く外国の一次資料を取り寄せ、verification/sources-raw.json に記して枝に戻す。
# 手で動かす。取り寄せた文は、運営者が読んでから引用に使う。
on:
  workflow_dispatch:
  push:
    branches: ['claude/legality-sources-1111']
    paths: ['tools/sources.js']

permissions:
  contents: write

jobs:
  fetch:
    name: 一次資料を取り寄せる
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: node tools/sources.js
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add verification/sources-raw.json
          git commit -m "一次資料：取り寄せた文を記す" || exit 0
          git push
