name: 一次資料の取り寄せ

# 適法性の説明が引く外国の一次資料を取り寄せ、verification/sources-raw.json に記して、新しい枝 sources/<日付> に置く。
# 手で動かす。main には直に入れない。取り寄せた文は、運営者が読んでから verification/sources.json の引用に使う。
# 法令・条約と国の機関の文のほかは、引いた箇所と検査が拠る箇所だけを記す。取り寄せた全文と窓は、この実行の
# artifact（sources-full）に残し、git には入れない（tools/sources.js の冒頭の注釈）。
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    name: 一次資料を取り寄せる
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: node tools/sources.js
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: sources-full
          path: sources-full/
          retention-days: 90
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add verification/sources-raw.json
          git commit -m "一次資料：取り寄せた文を記す" || exit 0
          git push origin "HEAD:refs/heads/sources/$(date -u +%Y%m%d-%H%M)"
