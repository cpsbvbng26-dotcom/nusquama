name: 叙任の願い出の確認

# 叙任の願い出の issue が開かれたり直されたりすると、様式の印と、訂正へのリンクが https の URL で受けない先を指さないかを確かめてコメントする。
# 訂正へのリンクは開かない。外へ出す要求は GitHub の API だけである。
# 何も決めない。叙任を決めるのは運営者である。
on:
  issues:
    types: [opened, edited, reopened]

permissions:
  contents: read
  issues: write

concurrency:
  group: knighting-${{ github.event.issue.number }}
  cancel-in-progress: true

jobs:
  check:
    if: contains(github.event.issue.labels.*.name, '叙任')
    name: 様式と訂正へのリンクを確かめる
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      # issue の文は、シェルにも環境変数にも入れない。環境変数は実行の記録に写るので、tools/knighting.js が出来事のファイル（GITHUB_EVENT_PATH）から読む。
      - run: node tools/knighting.js
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
