name: 記す

# 見張りが作った PR（statutes/record）に、リポジトリの持ち主がラベル「記す」を付けたとき、
# tools/record.js が main に取り込み、取り込んだ結果で検査を回し、通ったときだけ push する。
on:
  pull_request:
    types: [labeled]

permissions:
  contents: write
  issues: write
  pull-requests: write

# main への変更は一度に一つ。
concurrency:
  group: main-push
  cancel-in-progress: false

jobs:
  record:
    if: github.event.label.name == '記す' && github.event.sender.login == github.repository_owner && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'statutes/record'
    name: 見張りの提案を記す
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      # PR の番号と枝の名は環境変数で渡す。PR の題は、tools/record.js が出来事のファイル（GITHUB_EVENT_PATH）から読む。
      # 題を環境変数に入れると、実行の記録に写るため（2026-11-14、突き合わせの受付の点検）。
      - run: node tools/record.js
        env:
          PR: ${{ github.event.pull_request.number }}
          BRANCH: ${{ github.event.pull_request.head.ref }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
