name: 記す

# 見張りが作った PR（statutes/record）に、リポジトリの持ち主がラベル「記す」を付けたとき、
# tools/record.js が main に取り込み、取り込んだ結果で検査を回し、通ったときだけ push する。
on:
  pull_request:
    types: [labeled]

permissions:
  contents: write
  issues: write
  pull-requests: write

# main への変更は一度に一つ。
concurrency:
  group: main-push
  cancel-in-progress: false

jobs:
  record:
    if: github.event.label.name == '記す' && github.event.sender.login == github.repository_owner && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'statutes/record'
    name: 見張りの提案を記す
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      # 入力は環境変数だけを通して渡す。
      - run: node tools/record.js
        env:
          PR: ${{ github.event.pull_request.number }}
          BRANCH: ${{ github.event.pull_request.head.ref }}
          TITLE: ${{ github.event.pull_request.title }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
