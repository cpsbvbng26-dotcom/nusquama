name: 検査

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: 生成物・断り・規程の約束・外への要求・ヘッダー・誓い・アイコン
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: node verification/check.js
