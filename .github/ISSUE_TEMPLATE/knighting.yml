name: 叙任の願い出
description: 自分の誤りを一つ公に訂正した人が、正誤表騎士団への叙任を願い出る。無償。創作の中のことで、法的な効力はない。
title: "叙任：<GitHub のアカウント名>"
labels: ["叙任"]
body:
  - type: markdown
    attributes:
      value: |
        **2026-11-12 から 2026-11-22 0 時（日本時間）より前は、願い出の受付を止めています。** そのあいだに開かれた願い出は受けず、自動の確認が閉じます。2026-11-22 から、改めた規程（日本に住み日本にいる人に限ること、イタリアの国籍を持つ人を除くこと、良識の前提）で、この様式から願い出ることができます（叙任の規程「受付の停止」）。
        Applications are paused from 2026-11-12 until 00:00 on 2026-11-22 (Japan time). An application opened during the pause is not accepted and is closed automatically. From 2026-11-22, applications reopen under the revised rules.
        この国は創作であり、遊びです。実在の国家・王室・騎士団・叙勲とは関係がなく、ここで贈る騎士の呼び名は、勲章・栄典・騎士の位ではなく、法的な効力もありません。
        叙任は無償です。本名・住所・所属・連絡先は書かないでください。この issue は公開されます。
        訂正へのリンクの先に本名や所属が書かれていると、このアカウントとその人が結び付いて公開されます。
        書いたものは、叙任を判断すること、名簿を載せること、求めに応じることにだけ使います。
        書いたものは GitHub と Vercel（どちらも米国）で扱われます。米国の制度と、GitHub と Vercel の措置は、個人情報の取り扱いの節「第三者への提供と外国にある事業者」に書いてあります。https://nusquama.vercel.app/policies/privacy.html
        下の誓いで同意する前に、その節を確かめてください。
  - type: input
    id: correction
    attributes:
      label: 訂正への公開のリンク
      description: 自分の誤りを公に訂正したものへのリンク。論文の正誤表、ブログの追記、コードの修正、どれでもよい。
      placeholder: https://
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: 何を誤り、どう正したか
      description: 一、二文で足ります。他人の個人情報や、病気・障害・信条・犯罪の経歴など配慮の要る事柄を書かないでください。
    validations:
      required: true
  - type: checkboxes
    id: oath
    attributes:
      label: 誓い
      options:
        - label: 訂正したのは、自分自身の誤りです。
          required: true
        - label: この国が創作であり、称号に法的な効力も現実の栄誉もないことを分かっています。
          required: true
        - label: 騎士の称号は、この国の中でだけ使います。履歴書・論文・名刺・公的な書類には書きません（基本法第八条）。
          required: true
        - label: 叙任のために、誰にも何も支払いません（基本法第六条）。
          required: true
        - label: 16 歳以上です。GitHub のアカウント名・訂正へのリンク・書いた説明が公開され、騎士の名簿に載ること、それらが GitHub と Vercel（どちらも米国）で扱われることに同意します。
          required: true
        - label: 住んでいる国の法令は、私人の授ける騎士の称号を受けることや使うことを禁じていません。
          required: true
        - label: 日本に住んでいて、いま日本にいます（旅行・出張・留学などで日本の外にいるあいだは願い出られません。2026-11-22 から、この印のない願い出は受けません。イタリアの国籍を持つ人を除き、国籍は問いません）。
          required: false
        - label: イタリアの国籍を持っていません（ほかの国籍と重ねて持つ場合も含みます。2026-11-22 から、この印のない願い出は受けません）。
          required: false
        - label: 称号を遊びとして扱い、規程の禁じる使い方をしません（この国の外で使う、実在の称号や叙勲と誤認させる、履歴書・名刺などに書く、売る、人をだますために使う、のどれもしません。2026-11-22 から、この印のない願い出は受けません）。
          required: false
        - label: 利用規約・免責事項・個人情報の取り扱い・叙任の規程を読み、願い出の日の版に同意します（https://github.com/cpsbvbng26-dotcom/nusquama/tree/main/policies）。
          required: true
