name: 権利者の知らせ
description: ヌスクァマの名・国章・サイトの文が、商標・著作権・肖像などの権利を侵していると知らせる。無償。
title: "権利：<頁の名>"
labels: ["求め"]
body:
  - type: markdown
    attributes:
      value: |
        この国は創作であり、遊びです。実在の国家・王室・騎士団・叙勲とは関係がありません。
        この様式は、ヌスクァマの名や国章、サイトの文が権利を侵していると考える権利者のためのものです。扱いは、名称と権利の「権利者の方へ」にあります。https://nusquama.vercel.app/policies/names.html
        名としるし、調べた記録、知らせが来たときの手順は、名称と権利の「名称と商標」にあります。https://nusquama.vercel.app/policies/names.html
        運営者は、すべての知らせを読みます。権利が確かめられたときは、運営者が名を変えるか、その文や国章を使うのをやめます。決めたことは issue に書き、変えたことは年表と官報に記します。
        費用はかかりません。
        この issue は公開されます。本名・住所・所属・連絡先は書きません。権利と、それがどこにあるかを、問題の素材そのものを書き写さずに書きます。
        公開の場で書けない事情があるときは、この様式ではなく、削除・訂正・辞退の求めの様式で、種類に「非公開の連絡を求める」を選び、ほかは空のまま出します。運営者が非公開で答えるのは、GitHub のプロフィールに連絡先を公開している人にだけです。https://github.com/cpsbvbng26-dotcom/nusquama/issues/new?template=request.yml
        書いたものは、この知らせに応じることにだけ使います。扱いは個人情報の取り扱いにあります。https://nusquama.vercel.app/policies/privacy.html
  - type: dropdown
    id: kind
    attributes:
      label: どの権利か
      options:
        - 商標、または紛らわしい名
        - 著作権
        - 肖像やパブリシティ
        - そのほかの権利
    validations:
      required: true
  - type: input
    id: where
    attributes:
      label: どこにあるか
      description: https://nusquama.vercel.app/ で始まる頁の URL か、リポジトリのファイルの名。名そのものについては、名を示すどの頁の URL でもかまいません。
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: どんな権利か
      description: 商標なら、登録されていればその登録番号と登録した官庁、指定する商品や役務。そのほかの権利なら、何を守る権利か。素材そのものは書き写しません。
    validations:
      required: true
  - type: textarea
    id: ask
    attributes:
      label: 何を求めるか
      description: たとえば、名を変えること、その文や国章を使うのをやめること。
    validations:
      required: true
  - type: dropdown
    id: relation
    attributes:
      label: どう関わるか
      options:
        - 権利を持っている
        - 権利者の代理をしている
        - そのほか
    validations:
      required: true
  - type: checkboxes
    id: consent
    attributes:
      label: 言語モデルに渡ること（任意）
      description: |
        運営者は、ヌスクァマの作業を Claude Code で行います。欄に印があれば、この issue の題と本文は、知らせを扱う手助けのために、Anthropic（米国）の言語モデル Claude に渡ることがあります。運営者は、これを個人情報保護法第28条の外国にある第三者への提供として扱います。米国の制度と Anthropic の措置は、個人情報の取り扱いの「第三者への提供と外国にある事業者」にあります。https://nusquama.vercel.app/policies/privacy.html
        印は任意です。印がなければ、運営者は、Claude にもほかの言語モデルにも渡さずに知らせを扱います。この issue のコメントは、言語モデルに渡しません。同意は、この issue で、いつでも撤回できます。
      options:
        - label: この issue の題と本文を、運営者が Claude（Anthropic、米国）に渡すことに同意します。 / I consent to the operator giving the title and text of this issue to Claude (Anthropic, United States).
          required: false
