name: 誤りの知らせ
description: 王の書いた文（規程・正誤表・国の言葉のラテン語など）の誤りを知らせる。無償。知らせても、叙任にはならない。
title: "誤り：<頁の名>"
labels: ["誤り"]
body:
  - type: markdown
    attributes:
      value: |
        この国は創作であり、遊びです。実在の国家・王室・騎士団・叙勲とは関係がありません。
        この issue は公開されます。本名・住所・所属・連絡先は書かないでください。
        書いたものは、知らされた誤りを確かめ、王の正誤表に記すことにだけ使います。
        王が確かめた誤りは、王の誤りとして王の正誤表に記します。知らせた人の名は、正誤表に書きません。
        王の誤りを知らせることは、叙任の条件（自分の誤りを一つ、公に訂正したこと）には当たりません。
        ラテン語の誤り（語形・格・綴り・文法）は、分類で「語」を選びます。国の言葉のラテン語には、辞書で確かめていないものがあります。
        書いたものは GitHub（米国）で扱われます。扱いは個人情報の取り扱いにあります。https://nusquama.vercel.app/policies/privacy.html
        2026-12-01 から、誤りの知らせは日本にいる人からだけ受けます。日本にいることは、「ORCID iD」の欄の ORCID の公開の記録で確かめます。読むのは、この issue を開く GitHub のアカウントへのリンクと、公開の住所の国、いまの勤め先と在学先の組織の国だけです。国籍は読みません。日本を指す項目が 30 日以上前からあり、ほかの国を指す項目が無いときに確かめられます。確かめられなければ、ラベル「place not verified」と決まった文のコメントを付けます。issue は閉じません。削除・訂正・辞退の求めは、どの国の人からも受けます。扱いは個人情報の取り扱いにあります。
        2026-12-01 から、この様式は「突き合わせの受付」で確かめます。「どこにあるか」の所に「書いてあること」の語がそのとおりにあれば、ラベル「quote verified」が付きます。見つからなければ、ラベル「not verified」と決まった文のコメントを付けます。本文を直すか、新しい issue で出し直せば、もう一度確かめます。誤りかどうかは、王が読んで決めます。突き合わせの受付は、どの issue も閉じません。自分についての記載の訂正や削除、辞退、権利、個人の情報、同意の求めは、「削除・訂正・辞退の求め」の様式で受けます。
  - type: dropdown
    id: kind
    attributes:
      label: 分類
      description: 王の正誤表の分類です。迷うときは、近いものを選びます。
      options:
        - 事実
        - 語（ラテン語を含む）
        - 法
        - 範囲
        - 誤字
        - 数
    validations:
      required: true
  - type: input
    id: where
    attributes:
      label: どこにあるか
      description: 欄の初めに、https://nusquama.vercel.app/ で始まる頁の URL か、リポジトリのファイルの名（例 KNIGHTS.md）を一つだけ書きます。節はその後に書けます（確かめるのは頁かファイルの全体です）。
    validations:
      required: true
  - type: textarea
    id: quote
    attributes:
      label: 書いてあること
      description: 2026-12-01 から必須です。誤りの語を、書いてあるとおりに一字ずつ写します。空白の違いは見ません。空白を除いて 6 文字以上。
    validations:
      required: false
  - type: textarea
    id: what
    attributes:
      label: 何が誤りで、何が正しいか
      description: 短くてかまいません。他人の個人情報は書かないでください。
    validations:
      required: true
  - type: input
    id: orcid
    attributes:
      label: ORCID iD
      description: 2026-12-01 から使います。0000-0000-0000-0000 の形で書きます。その ORCID の公開の記録に、この issue を開く GitHub のアカウント（https://github.com/<アカウント>）へのリンクが要ります。
    validations:
      required: false
  - type: textarea
    id: source
    attributes:
      label: 確かめた先
      description: 辞書・資料・条文など。なければ空のままでかまいません。
    validations:
      required: false
