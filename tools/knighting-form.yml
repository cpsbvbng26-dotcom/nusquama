# 叙任の願い出の様式の定義。受付を止めているあいだ（tools/knighting.js の REOPEN が null のあいだ）は、
# issue の様式の一覧（.github/ISSUE_TEMPLATE/）に置かず、ここに残す。受付に戻すときは、この定義をそこへ写す。
# 2026-11-13 に Claude が決めた（点検の記録「2026-11-13：十四度目の見落とし」）。検査 78 が確かめる。
name: 叙任の願い出
description: 自分の誤りを一つ公に訂正した人が、正誤表騎士団への叙任を願い出る。無償。創作の中のことで、法的な効力はない。
title: "叙任：<GitHub のアカウント名>"
labels: ["叙任"]
body:
  - type: markdown
    attributes:
      value: |
        **2026-11-12 から、願い出の受付を止めています。受付に戻る日は決めていません。** そのあいだに開かれた願い出は受けず、自動の確認が閉じます。授けることに関わるイタリアの法令の一点が、条文からは決まらないためです（叙任の規程「受付の停止」）。
        Applications are paused from 2026-11-12, and no date for reopening has been set. An application opened during the pause is not accepted and is closed automatically. A point of Italian law concerning conferral is not settled by the texts (Rules on Knighting, "Pause in receiving applications").
        ヌスクァマは個人で運営しているため、参加のハードルを極端に高くしています。 / Because Nusquama is run by one individual, its barriers to participation are set extremely high.
        2026-11-24 から、願い出ることができるのは、生まれてから一度も日本の外に出たことがない人だけです。旅行・出張・留学・乗り継ぎで出たことも、日本の外で生まれたことも、出たことに数えます。確かめるのは下の誓いの印だけで、旅券・日付・行った国は尋ねません。書かないでください（叙任の規程「日本の外に出たことがないこと」）。
        From 2026-11-24, only people who have never been outside Japan since birth may apply. Travel, business trips, study abroad, transit and being born outside Japan all count as having been outside. Only the box below is checked; no passport, date or country visited is asked for. Do not write them (Rules on Knighting, "Never having been outside Japan").
        2026-12-15 から、願い出ることができるのは、日本の国籍を持つ人だけです。日本の国籍と重ねてイタリアや「外国の称号を縛る国」の国籍を持つ人は、願い出ることができません。この issue で確かめるのは下の誓いの印だけで、旅券・戸籍・住民票などの書類も、ほかに持つ国籍も尋ねません。書かないでください（叙任の規程「日本の国籍を持つこと」）。
        受付に戻ったあとは、運営者が、願い出ごとに作る非公開のリポジトリで、戸籍の個人事項証明書（紙の戸籍では戸籍抄本）の画像を確かめます。氏名・本籍などは隠したもので、7 日以内に削除し、issue には結果の一行だけを記します。電子メールは使いません。個人番号（マイナンバー）と、個人番号の見えるものは送らないでください（叙任の規程「日本の国籍の書類による確かめ」）。
        From 2026-12-15, only people who hold Japanese nationality may apply. A person who also holds Italian nationality, or the nationality of a country under "Countries that restrict foreign titles", may not apply. In this issue only the box below is checked; no passport, family register, certificate of residence or other nationality is asked for. Do not write them (Rules on Knighting, "Holding Japanese nationality").
        After applications reopen, the operator checks an image of a personal record certificate of the family register (or an extract of a paper register) in a private repository created for each application. The name, permanent domicile and other parts are masked, the repository is deleted within 7 days, and only a one-line result is recorded in the issue. Email is not used. Do not send your Individual Number (My Number) or anything that shows it (Rules on Knighting, "Checking Japanese nationality by document").
        叙任は、すべてオンラインで行います。式典も、書状や物の送付もありません（叙任の規程「叙任とは」）。 / Knighting is done entirely online. There is no ceremony, and no letter or object is sent (Rules on Knighting, "What knighting is").
        2026-12-15 から、願い出ることができるのは 18 歳以上の人だけです。同じアカウントからの願い出は 365 日に一度までで、叙任は一年に 1 人まで、決めるのは願い出から 90 日を過ぎてからです（叙任の規程「参加のハードル」）。
        2026-12-15 から、訂正は、自分が書いて公開した文の誤りを、前の版が残る場（Git の履歴・版を分けて残す登録・正誤表の頁）で正し、願い出の 180 日以上前に公開したものに限ります。願い出の GitHub のアカウントは 2 年以上前に作られたものに限り、叙任は 2 年に 1 人までです。断った願い出のアカウントからは、二度と願い出を受けません（叙任の規程「参加のハードルの続き」）。
        From 2026-12-15, the correction must fix an error in a text the applicant wrote and published, be made in a place that keeps the earlier version (a Git history, a registry that keeps versions apart, or an erratum page), and have been published at least 180 days before the application. The GitHub account must have been created at least 2 years earlier, and at most 1 person is knighted in 2 years. No application is ever received again from an account whose application was declined (Rules on Knighting, "Barriers to participation (continued)").
        この国は創作であり、遊びです。実在の国家・王室・騎士団・叙勲とは関係がなく、ここで贈る騎士の呼び名は、勲章・栄典・騎士の位ではなく、法的な効力もありません。
        叙任は無償です。本名・住所・所属・連絡先は書かないでください。この issue は公開されます。
        訂正へのリンクの先に本名や所属が書かれていると、このアカウントとその人が結び付いて公開されます。
        書いたものは、叙任を判断すること、名簿を載せること、求めに応じることにだけ使います。
        書いたものは GitHub と Vercel（どちらも米国）で扱われます。米国の制度と、GitHub と Vercel の措置は、個人情報の取り扱いの節「第三者への提供と外国にある事業者」に書いてあります。https://nusquama.vercel.app/policies/privacy.html
        下の誓いで同意する前に、その節を確かめてください。
  - type: input
    id: correction
    attributes:
      label: 訂正への公開のリンク
      description: 自分の誤りを公に訂正したものへのリンク。論文の正誤表、ブログの追記、コードの修正、どれでもよい。
      placeholder: https://
    validations:
      required: true
  - type: input
    id: published
    attributes:
      label: 訂正を公開した日
      description: 2026-12-15 から必須です。訂正を公開した日を、2026-06-17 の形（年-月-日）で書きます。リンクの先で、同じ日が見られるものに限ります。
      placeholder: 2026-06-17
    validations:
      required: false
  - type: textarea
    id: what
    attributes:
      label: 何を誤り、どう正したか
      description: 一、二文で足ります。他人の個人情報や、病気・障害・信条・犯罪の経歴など配慮の要る事柄を書かないでください。
    validations:
      required: true
  - type: textarea
    id: places
    attributes:
      label: 称号を使わない場所
      description: 2026-12-15 から必須です。この国の称号を書かない場所を、規程の語（履歴書・論文・名刺・公的な書類・学術の場・商取引・広告）で三つ以上書きます。自分のことは書きません。
    validations:
      required: false
  - type: checkboxes
    id: oath
    attributes:
      label: 誓い
      options:
        - label: 訂正したのは、自分自身の誤りです。
          required: true
        - label: 誤りの元の文は、自分が書いて公開した文です。他人の文の誤りを指摘したものではありません（共著の文は、自分が著者に入っていれば数えます。2026-12-15 から、この印が要ります）。
          required: false
        - label: この国が創作であり、称号に法的な効力も現実の栄誉もないことを分かっています。
          required: true
        - label: 騎士の称号は、この国の中でだけ使います。履歴書・論文・名刺・公的な書類には書きません（基本法第八条）。
          required: true
        - label: 叙任のために、誰にも何も支払いません（基本法第六条）。
          required: true
        - label: 16 歳以上です。GitHub のアカウント名・訂正へのリンク・書いた説明が公開され、騎士の名簿に載ること、それらが GitHub と Vercel（どちらも米国）で扱われることに同意します。
          required: true
        - label: 18 歳以上です（2026-12-15 から、この印が要ります）。
          required: false
        - label: 住んでいる国の法令は、私人の授ける騎士の称号を受けることや使うことを禁じていません。
          required: true
        - label: 日本に住んでいて、いま日本にいます（旅行・出張・留学などで日本の外にいるあいだは願い出られません。この印のない願い出は受けません。イタリアと、叙任の規程「外国の称号を縛る国」の国籍を持つ人を除き、国籍は問いません。2026-12-15 から、日本の国籍を持つ人に限ります）。
          required: true
        - label: 生まれてから一度も、日本の外に出たことがありません（旅行・出張・留学・乗り継ぎで出たことも、日本の外で生まれたことも、出たことに数えます。2026-11-24 から、この印が要ります）。 / Since birth, I have never been outside Japan (travel, business trips, study abroad, transit and being born outside Japan all count as having been outside; this box is required from 2026-11-24).
          required: false
        - label: 日本の国籍を持っています（日本の国籍と重ねてイタリアや「外国の称号を縛る国」の国籍を持つ人は願い出られません。2026-12-15 から、この印が要ります）。 / I hold Japanese nationality (a person who also holds Italian nationality, or the nationality of a country under "Countries that restrict foreign titles", may not apply; this box is required from 2026-12-15).
          required: false
        - label: 受付に戻ったあとの「日本の国籍の書類による確かめ」を受けます。画像は運営者が招く非公開のリポジトリにだけ置き、画像が GitHub（米国）で扱われることに同意します。個人番号（マイナンバー）と、個人番号の見えるものは送りません（受付に戻ったあと、この印が要ります）。 / I accept "Checking Japanese nationality by document" after applications reopen. I will place the image only in the private repository the operator invites me to, and agree to its being handled by GitHub (United States). I will not send my Individual Number (My Number) or anything that shows it (this box is required after applications reopen).
          required: false
        - label: イタリアの国籍を持っていません（ほかの国籍と重ねて持つ場合も含みます。この印のない願い出は受けません）。
          required: true
        - label: 次の国の国籍を持っていません：アイルランド、アメリカ合衆国、イエメン、インド、オーストリア、オランダ、ギリシャ、コロンビア、ドミニカ共和国、ネパール、ハンガリー、バングラデシュ、パキスタン、フィリピン、ベネズエラ、ベルギー、ホンジュラス、メキシコ。国籍を持つほかの国の法令も、外国の称号を受けることを禁じたり、国の許しを求めたり、受けたことに国籍の喪失や罰を結び付けたりしていません（ほかの国籍と重ねて持つ場合も含みます。この印のない願い出は受けません）。
          required: true
        - label: 称号を遊びとして扱い、規程の禁じる使い方をしません（この国の外で使う、実在の称号や叙勲と誤認させる、履歴書・名刺などに書く、売る、人をだますために使う、のどれもしません。この印のない願い出は受けません）。
          required: true
        - label: 利用規約・免責事項・個人情報の取り扱い・叙任の規程を読み、願い出の日の版に同意します（https://github.com/cpsbvbng26-dotcom/nusquama/tree/main/policies）。
          required: true
